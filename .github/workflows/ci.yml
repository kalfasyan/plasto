name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Format, vet and test
        working-directory: backend
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go vet ./...
          go test -race ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Lint, check, test and build
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run check
          npm test
          npm run build

  workers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: workers/uv.lock
      # the tests build the backend and run the worker kit and the demo worker against it
      - name: Lint and test
        working-directory: workers
        run: |
          uv sync --locked
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q

  image:
    needs: [backend, web, workers]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Build for this runner only and check that the container starts and serves the app.
      - name: Build for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: plasto:smoke
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name smoke -p 8090:8090 plasto:smoke
          for i in $(seq 1 30); do curl -sf localhost:8090/api/health && break; sleep 1; done
          curl -sf localhost:8090/api/app/info | grep -q '"version":"${{ github.sha }}"'
          curl -sf localhost:8090/ | grep -q '<div id="app">'
          curl -sf localhost:8090/manifest.webmanifest | grep -q '"display": "standalone"'
          curl -sf localhost:8090/api/app/setup | grep -q '"needed":true'
          docker logs smoke
          docker rm -f smoke

      # On main, publish the image for every platform people run it on.
      - uses: docker/setup-qemu-action@v3
        if: github.event_name == 'push'
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          build-args: VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
